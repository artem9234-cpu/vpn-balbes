<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN конфиги для Балбесов</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-decoration: none;
            text-align: center;
        }
        .btn-black {
            background: linear-gradient(135deg, #2c3e50 0%, #4a5568 100%);
        }
        .btn-white {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }
        .info b { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 VPN конфиги</h1>
        <p class="subtitle">Скачай файл и добавь в Hiddify / NekoBox</p>
        
        <!-- Используем jsDelivr CDN для принудительного скачивания -->
        <a href="https://cdn.jsdelivr.net/gh/artem9234-cpu/vpn-balbes@main/black.txt" 
           class="btn btn-black" 
           download="VPN_Black_List.txt">
            ⚫ Скачать черные списки
        </a>
        
        <a href="https://cdn.jsdelivr.net/gh/artem9234-cpu/vpn-balbes@main/white.txt" 
           class="btn btn-white" 
           download="VPN_White_List.txt">
            ⚪ Скачать белые списки
        </a>
        
        <div class="info">
            <b>📱 Как использовать:</b><br>
            1️⃣ Нажми на нужную кнопку выше<br>
            2️⃣ Файл скачается автоматически<br>
            3️⃣ Открой Hiddify или NekoBox<br>
            4️⃣ Нажми «Добавить из файла» и выбери скачанный .txt
        </div>
    </div>

    <script>
        // Для авто-скачивания через параметры URL
        const urlParams = new URLSearchParams(window.location.search);
        const autoFile = urlParams.get('file');
        
        if (autoFile === 'black' || autoFile === 'white') {
            setTimeout(() => {
                const link = document.createElement('a');
                link.href = autoFile === 'black' 
                    ? 'https://cdn.jsdelivr.net/gh/artem9234-cpu/vpn-balbes@main/black.txt'
                    : 'https://cdn.jsdelivr.net/gh/artem9234-cpu/vpn-balbes@main/white.txt';
                link.download = autoFile === 'black' ? 'VPN_Black_List.txt' : 'VPN_White_List.txt';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, 500);
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    </script>
</body>
</html>
